<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIMSEC AI Teacher · Owner Dashboard</title>
<style>
:root{--g:#0a7d3e;--g2:#e7f4ec;--y:#f5b800;--ink:#14231a;--mut:#5d6b62;--bg:#f5f7f5;--card:#fff;--bad:#c0392b;--warn:#b7791f;--line:#e1e8e2}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.top{background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.top h1{margin:0;font-size:17px}.top small{opacity:.85;display:block}
.top button{background:transparent;border:1px solid #fff8;color:#fff;border-radius:8px;padding:6px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
nav button{border:0;background:var(--g2);color:var(--g);padding:8px 14px;border-radius:999px;font-weight:600;white-space:nowrap;font-size:14px}
nav button.on{background:var(--g);color:#fff}
nav .sep{width:1px;background:var(--line);margin:0 4px;flex:none}
main{max-width:780px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:18px}
.mut{color:var(--mut)}.sm{font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:4px 0}
.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:18px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--mut)}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd8d1;border-radius:10px;font:inherit;background:#fff}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:700;font-size:15px}
.btn[disabled]{opacity:.5}
.btn.ghost{background:var(--g2);color:var(--g)}.btn.bad{background:var(--bad)}.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin-top:0}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.chip.ok{background:#d9f2e3;color:#0a6b35}.chip.warn{background:#fdf0cf;color:#8a5a00}.chip.bad{background:#fbe0dc;color:#a52a1e}.chip.mut{background:#eceff0;color:#56626a}
.alert{padding:12px;border-radius:12px;margin-bottom:12px;font-size:14px}
.alert.warn{background:#fff6dd;border:1px solid #f0d58a}.alert.bad{background:#fdeceb;border:1px solid #f1b9b3}.alert.ok{background:#e7f6ec;border:1px solid #a9d9bb}
.big{font-size:30px;font-weight:800;color:var(--g)}
.num{font-size:22px;font-weight:800;letter-spacing:.5px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mut)}
.bars{display:flex;gap:4px;align-items:flex-end;height:110px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar i{display:block;width:100%;background:var(--g);border-radius:4px 4px 0 0;min-height:2px}
.bar span{font-size:10px;color:var(--mut)}
ol{padding-left:20px}li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14231a;color:#fff;padding:10px 16px;border-radius:12px;z-index:9;max-width:90%}
.toast.bad{background:var(--bad)}
.click{cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;width:100%;border:0}.noprint{display:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- CONFIG: paste your Supabase values (or set window.zimsecSupabase before this script) ---------- */
const CONFIG = { SUPABASE_URL: 'YOUR_SUPABASE_URL', SUPABASE_ANON_KEY: 'YOUR_SUPABASE_ANON_KEY' };
const sb = window.zimsecSupabase || supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

/* ---------- helpers ---------- */
const S = { tab: 'dash', uid: null, role: null, cfg: null, txId: null, txStatus: '', txQ: '' };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, c) => { c = c || S.cfg?.currency || 'USD'; try { return new Intl.NumberFormat('en-ZW', { style: 'currency', currency: c }).format(n) } catch { return c + ' ' + Number(n).toFixed(2) } };
const when = d => d ? new Date(d).toLocaleString('en-GB', { timeZone: 'Africa/Harare', dateStyle: 'medium', timeStyle: 'short' }) : '—';
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const toast = (m, bad) => { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 4200) };
const rpc = async (n, a = {}) => { const { data, error } = await sb.rpc(n, a); if (error) throw error; return data };
const guard = fn => async (...a) => { try { await fn(...a) } catch (e) { toast(e.message || String(e), true) } };
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms) } };
const CHIP = { verified: 'ok', submitted: 'warn', awaiting_payment: 'mut', rejected: 'bad', expired: 'mut', cancelled: 'mut', active: 'ok', used: 'mut', pending: 'warn', approved: 'ok' };
const chip = s => `<span class="chip ${CHIP[s] || 'mut'}">${esc(String(s).replace('_', ' '))}</span>`;
const isStaff = () => !!S.role;
const isOwner = () => S.role === 'owner';

/* ---------- boot & sign-in ---------- */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return signIn();
  S.uid = session.user.id;
  S.cfg = await rpc('zpay_public_config');
  S.role = await rpc('zpay_my_role');
  if (!S.role) {
    $('#root').innerHTML = `<div class="top"><h1>ZIMSEC AI Teacher<small>Owner dashboard</small></h1><button data-act="out">Sign out</button></div>
    <main><div class="alert bad">This account is not an administrator. Students use ZIMSEC AI Teacher on WhatsApp. Ask the owner to add you in <b>zpay_admins</b>.</div></main>`;
    return;
  }
  shell(); draw();
}
function signIn() {
  $('#root').innerHTML = `<div class="top"><h1>ZIMSEC AI Teacher<small>Owner dashboard: sign in</small></h1></div>
  <main><div class="card"><label>Email</label><input id="em" type="email" autocomplete="email">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" data-act="login">Sign in</button></div></main>`;
}
/* ---------- shell ---------- */
function shell() {
  const adm = [['dash', 'Dashboard'], ['tx', 'Transactions'], ['svc', 'Pricing'], ['set', 'Settings'], ['audit', 'Audit log']];
  $('#root').innerHTML = `<div class="top"><h1>ZIMSEC AI Teacher<small>Owner dashboard · ${esc(cap(S.role))}</small></h1><button data-act="out">Sign out</button></div>
  <nav>${adm.map(([t, l]) => `<button data-act="tab" data-t="${t}">${l}</button>`).join('')}</nav>
  <main><div id="view"></div></main>`;
}
async function draw() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  try { await V[S.tab]() } catch (e) { $('#view').innerHTML = `<div class="alert bad">${esc(e.message || e)}</div>` }
}

const V = {};

/* ---------- ADMIN ---------- */
V.dash = async () => {
  const d = await rpc('zpay_dashboard'), m = n => money(n, d.currency);
  const mx = Math.max(1, ...d.daily.map(x => +x.revenue));
  const k = (l, v, st) => `<div class="kpi ${st ? 'click' : ''}" ${st ? `data-act="txf" data-st="${st}"` : ''}><b>${v}</b><span>${l}</span></div>`;
  $('#view').innerHTML = `<div class="grid">${k('Total revenue', m(d.total_revenue))}${k('Today', m(d.today))}${k('This week', m(d.week))}${k('This month', m(d.month))}
  ${k('Subscription revenue', m(d.subscription_revenue))}${k('Paying students', d.paying_students)}${k('Successful payments', d.successful, 'verified')}
  ${k('Pending verification', d.pending_verification, 'submitted')}${k('Awaiting payment', d.awaiting_payment, 'awaiting_payment')}${k('Failed / expired', d.failed, 'rejected')}</div>
  <div class="card" style="margin-top:12px"><b>Revenue, last 14 days</b><div class="bars">${d.daily.map(x =>
    `<div class="bar" title="${esc(x.day)}: ${m(x.revenue)}"><i style="height:${Math.round(+x.revenue / mx * 100)}%"></i><span>${esc(x.day.slice(8))}</span></div>`).join('')}</div></div>
  <div class="card"><b>Most purchased services</b>${d.top_services.length ? d.top_services.map(t =>
    `<div class="row"><span>${esc(t.name)}</span><span class="mut">${t.purchases} sold · <b>${m(t.revenue)}</b></span></div>`).join('') : '<p class="mut">No sales yet.</p>'}</div>
  <button class="btn ghost" data-act="tab" data-t="dash">Refresh</button>`;
};
V.tx = async () => {
  const rows = await rpc('zpay_admin_transactions', { p_status: S.txStatus || null, p_search: S.txQ || null, p_limit: 100 });
  S.rows = rows;
  const sel = S.txId ? rows.find(r => r.id === S.txId) : null;
  let h = `<div class="card"><div class="two"><select id="fst">${['', 'submitted', 'awaiting_payment', 'verified', 'rejected', 'expired', 'cancelled']
    .map(s => `<option value="${s}" ${s === S.txStatus ? 'selected' : ''}>${s ? s.replace('_', ' ') : 'All statuses'}</option>`).join('')}</select>
  <input id="fq" placeholder="Search ref, txn ID, phone number" value="${esc(S.txQ)}"></div>
  <button class="btn sm" style="margin-top:8px" data-act="txsearch">Search</button></div>`;
  if (sel) {
    h += `<div class="card"><div class="row"><h2>${esc(sel.reference)}</h2>${chip(sel.status)}</div>
    ${[['Student', (sel.user_name || '') + ' ' + (sel.user_phone || '')], ['Service', sel.service_name + ' × ' + sel.units], ['Expected amount', money(sel.amount, sel.currency)],
      ['Paid to', sel.pay_to], ['Payer number', sel.payer_msisdn], ['EcoCash transaction ID', sel.ecocash_txn_id], ['Created', when(sel.created_at)],
      ['Submitted', when(sel.submitted_at)], ['Decided', when(sel.verified_at)], ['Receipt', sel.receipt_no], ['Decided by', sel.verified_by_label], ['Note', sel.admin_note]]
      .map(([k, v]) => `<div class="kv"><span class="mut">${k}</span><b style="text-align:right">${esc(v || '—')}</b></div>`).join('')}
    ${sel.status === 'submitted' ? `<div class="alert warn sm" style="margin-top:10px">Before approving, confirm in your EcoCash statement that <b>${money(sel.amount, sel.currency)}</b> arrived in <b>${esc(sel.pay_to)}</b> from <b>${esc(sel.payer_msisdn)}</b> with transaction ID <b>${esc(sel.ecocash_txn_id)}</b>.</div>
    <label>Note (optional)</label><input id="nt"><div class="two"><button class="btn" data-act="verify" data-id="${sel.id}">Verify &amp; activate</button><button class="btn bad" data-act="reject" data-id="${sel.id}">Reject</button></div>` : ''}
    <button class="btn ghost" data-act="txclose">Close</button></div>`;
  }
  h += rows.map(r => `<div class="card click" data-act="txopen" data-id="${r.id}"><div class="row"><b>${esc(r.service_name)}</b>${chip(r.status)}</div>
    <div class="row sm mut"><span>${esc(r.reference)} · ${esc(r.user_phone || '')}</span><b>${money(r.amount, r.currency)}</b></div><div class="sm mut">${when(r.created_at)}</div></div>`).join('') || '<div class="card mut">No transactions match.</div>';
  $('#view').innerHTML = h;
};
V.svc = async () => {
  const { data: sv, error } = await sb.from('zpay_services').select('*').order('name'); if (error) throw error;
  const { data: recs } = await sb.from('zpay_price_recs').select('*,zpay_services(name)').eq('status', 'pending').order('created_at', { ascending: false });
  const dis = isOwner() ? '' : 'disabled';
  const f = (s, k, l, step = '0.01') => `<div><label>${l}</label><input type="number" step="${step}" data-sid="${s.id}" data-f="${k}" value="${s[k]}" ${dis}></div>`;
  let h = (recs || []).map(r => `<div class="alert warn"><b>AI recommendation: ${esc(r.zpay_services.name)}</b><br>
    Unit price ${money(r.current_unit_price)} → <b>${money(r.proposed_unit_price)}</b> (margin ${r.current_margin}% → ${r.proposed_margin}%)<br>
    <span class="sm">${esc(r.rationale || '')}</span>
    ${isOwner() ? `<div class="two" style="margin-top:8px"><button class="btn sm" data-act="recdec" data-id="${r.id}" data-ok="1">Approve</button><button class="btn bad sm" data-act="recdec" data-id="${r.id}" data-ok="0">Reject</button></div>` : ''}</div>`).join('');
  h += (isOwner() ? '' : '<div class="alert warn sm">Only the owner can change prices.</div>') + sv.map(s => `<div class="card">
    <div class="row"><b>${esc(s.name)}</b>${chip(s.enabled ? 'active' : 'expired').replace('expired', 'suspended')}</div>
    <div class="two">${f(s, 'min_price', 'Min price / unit')}${f(s, 'max_price', 'Max price / unit')}${f(s, 'ai_cost_per_unit', 'AI cost / unit', '0.0001')}
    ${f(s, 'margin_pct', 'Margin %')}${f(s, 'ops_overhead_pct', 'Operating overhead %')}${f(s, 'fixed_cost', 'Fixed cost')}</div>
    ${isOwner() ? `<div class="actions" style="margin-top:10px"><button class="btn sm" data-act="svcsave" data-id="${s.id}">Save</button>
    <button class="btn ghost sm" data-act="svctoggle" data-id="${s.id}" data-on="${s.enabled ? 0 : 1}">${s.enabled ? 'Suspend service' : 'Enable service'}</button>
    <button class="btn ghost sm" data-act="advise" data-id="${s.id}">Ask AI for price advice</button></div>` : ''}</div>`).join('');
  $('#view').innerHTML = h;
};
V.set = async () => {
  const { data: st } = await sb.from('zpay_settings').select('*').single();
  const { data: dc } = await sb.from('zpay_discounts').select('*').order('code');
  const dis = isOwner() ? '' : 'disabled';
  $('#view').innerHTML = `<div class="card"><h2>EcoCash settings</h2>
  <label>EcoCash destination number</label><input id="s_num" inputmode="tel" value="${esc(st.ecocash_number)}" ${dis}>
  <label>Account name shown to students (optional)</label><input id="s_name" value="${esc(st.ecocash_account_name)}" ${dis}>
  <label>Support contact shown to students (optional)</label><input id="s_sup" value="${esc(st.support_contact)}" ${dis}>
  <div class="two"><div><label>Free questions per student per day</label><input id="s_free" type="number" min="0" max="100" value="${st.free_daily_questions}" ${dis}></div><div></div>
  <div><label>Expiry reminder (days before)</label><input id="s_days" type="number" value="${st.expiry_notice_days}" ${dis}></div>
  <div><label>Order valid for (minutes)</label><input id="s_min" type="number" value="${st.order_valid_minutes}" ${dis}></div></div>
  ${isOwner() ? '<button class="btn" data-act="setsave">Save settings</button>' : '<p class="mut sm">Only the owner can change these.</p>'}</div>
  <div class="card"><h2>Discounts</h2>${(dc || []).map(d => `<div class="row"><span><b>${esc(d.code)}</b> · ${d.percent}% · used ${d.used_count}${d.max_uses ? '/' + d.max_uses : ''}${d.ends_at ? ' · ends ' + when(d.ends_at) : ''}</span>
  ${isOwner() ? `<button class="btn ghost sm" data-act="disctoggle" data-code="${esc(d.code)}" data-on="${d.active ? 0 : 1}">${d.active ? 'Stop' : 'Start'}</button>` : chip(d.active ? 'active' : 'expired')}</div>`).join('') || '<p class="mut">No discounts.</p>'}
  ${isOwner() ? `<div class="two"><div><label>Code</label><input id="d_code"></div><div><label>Percent (max 90)</label><input id="d_pct" type="number"></div>
  <div><label>Ends on (optional)</label><input id="d_end" type="date"></div><div><label>Max uses (optional)</label><input id="d_max" type="number"></div></div>
  <button class="btn ghost" data-act="discadd">Add discount</button>` : ''}</div>
  ${isOwner() ? `<div class="card"><h2>Export financial report</h2><div class="two"><div><label>From</label><input id="x_from" type="date"></div><div><label>To</label><input id="x_to" type="date"></div></div>
  <button class="btn" data-act="export">Download CSV</button></div>` : ''}`;
};
V.audit = async () => {
  const { data, error } = await sb.from('zpay_audit').select('*').order('id', { ascending: false }).limit(100); if (error) throw error;
  $('#view').innerHTML = data.map(a => `<div class="card sm"><div class="row"><b>${esc(a.action)}</b><span class="mut">${when(a.at)}</span></div>
  <div class="mut">${esc(a.entity)} ${esc(a.entity_id || '')} · actor ${esc((a.actor || 'system').toString().slice(0, 8))}</div></div>`).join('');
};

/* ---------- CSV (guards against spreadsheet formula injection) ---------- */
const csvCell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s };

/* ---------- actions ---------- */
const reload = () => draw();
const A = {
  tab: d => { S.tab = d.t; S.txId = null; draw() },
  out: async () => { await sb.auth.signOut(); location.reload() },
  login: async () => { const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value }); if (error) throw error; boot() },
  /* admin */
  txf: d => { S.txStatus = d.st; S.txQ = ''; S.tab = 'tx'; draw() },
  txsearch: () => { S.txStatus = $('#fst').value; S.txQ = $('#fq').value.trim(); S.txId = null; draw() },
  txopen: d => { S.txId = d.id; draw() },
  txclose: () => { S.txId = null; draw() },
  verify: async d => { if (!confirm('Verify this payment and activate the service?')) return; await rpc('zpay_admin_verify', { p_order: d.id, p_approve: true, p_note: $('#nt').value || null }); toast('Verified. Service activated.'); draw() },
  reject: async d => { if (!confirm('Reject this payment?')) return; await rpc('zpay_admin_verify', { p_order: d.id, p_approve: false, p_note: $('#nt').value || null }); toast('Payment rejected'); draw() },
  svcsave: async d => {
    const p = {}; document.querySelectorAll(`[data-sid="${d.id}"]`).forEach(i => p[i.dataset.f] = +i.value);
    if (p.min_price > p.max_price) throw new Error('Minimum price cannot exceed maximum price');
    const { error } = await sb.from('zpay_services').update(p).eq('id', d.id); if (error) throw error; toast('Saved (applies to new orders only)'); draw();
  },
  svctoggle: async d => { const { error } = await sb.from('zpay_services').update({ enabled: d.on === '1' }).eq('id', d.id); if (error) throw error; draw() },
  advise: async d => {
    toast('Asking AI for a recommendation…');
    const { data, error } = await sb.functions.invoke('price-advisor', { body: { service_id: d.id } });
    if (error) throw error; if (data?.error) throw new Error(data.error); toast('Recommendation ready for your approval'); draw();
  },
  recdec: async d => { await rpc('zpay_decide_rec', { p_rec: d.id, p_approve: d.ok === '1' }); toast(d.ok === '1' ? 'Approved. New price applies to new orders.' : 'Rejected'); draw() },
  setsave: async () => {
    const n = $('#s_num').value.replace(/\s/g, '');
    if (!/^07[78][0-9]{7}$/.test(n)) throw new Error('Enter a valid EcoCash number, e.g. 0786610390');
    if (!confirm('Students will be told to pay ' + n + '. Continue?')) return;
    const { error } = await sb.from('zpay_settings').update({ ecocash_number: n, ecocash_account_name: $('#s_name').value, support_contact: $('#s_sup').value, free_daily_questions: +$('#s_free').value, expiry_notice_days: +$('#s_days').value, order_valid_minutes: +$('#s_min').value }).eq('id', true);
    if (error) throw error; S.cfg = await rpc('zpay_public_config'); toast('Settings saved'); draw();
  },
  discadd: async () => {
    const end = $('#d_end').value;
    const { error } = await sb.from('zpay_discounts').insert({ code: $('#d_code').value.trim().toUpperCase(), percent: +$('#d_pct').value, ends_at: end ? new Date(end + 'T23:59:59+02:00').toISOString() : null, max_uses: +$('#d_max').value || null });
    if (error) throw error; draw();
  },
  disctoggle: async d => { const { error } = await sb.from('zpay_discounts').update({ active: d.on === '1' }).eq('code', d.code); if (error) throw error; draw() },
  export: async () => {
    const f = $('#x_from').value, t = $('#x_to').value; if (!f || !t) throw new Error('Choose a date range');
    const rows = await rpc('zpay_export_report', { p_from: f, p_to: t });
    if (!rows.length) throw new Error('No verified payments in that range');
    const cols = Object.keys(rows[0]);
    const csv = [cols.join(','), ...rows.map(r => cols.map(c => csvCell(r[c])).join(','))].join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `zimsec-revenue-${f}_${t}.csv`; a.click();
  }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); const f = b && A[b.dataset.act]; if (f) guard(f)(b.dataset, b) });
boot().catch(e => { $('#root').innerHTML = `<main><div class="alert bad">${esc(e.message || e)}<br>Check CONFIG at the top of this file.</div></main>` });
</script>
</body>
</html>
